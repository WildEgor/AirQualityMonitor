[platformio]
extra_configs = ./**/*platformio.ini

[env]
framework = arduino
lib_deps =
    gyverlibs/AutoOTA@1.2.0
    gyverlibs/GyverDB@1.3.2
    gyverlibs/WiFiConnector@1.0.4
    gyverlibs/Settings@1.3.12
    gyverlibs/GSON@1.8.1
    gyverlibs/Looper@1.1.7
    gyverlibs/GyverBME280@1.5.3
    knolleary/PubSubClient@2.8
    sparkfun/SparkFun CCS811 Arduino Library@2.0.3
    sparkfun/SparkFun Indoor Air Quality Sensor - ENS160@1.1.0
    adafruit/Adafruit AHTX0@2.0.5
    bodmer/TFT_eSPI@2.5.43
    adafruit/Adafruit NeoPixel@1.15.1
extra_scripts = 
	pre:scripts/get_version.py
    scripts/copy_fw_files.py

[env:wemos_d1_mini]
platform = espressif8266
board = d1_mini
monitor_speed = 115200
build_type = release
board_build.filesystem = littlefs
monitor_raw = true
build_flags =
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13    ; D7
    -DTFT_SCLK=14    ; D5
    -DTFT_CS=15      ; D8
    -DTFT_DC=2       ; D4
    -DTFT_RST=-1      ; D1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DRGB_PIN=3      ; D4 (NeoPixel data)

[env:mhetesp32devkit]
platform = espressif32
board = mhetesp32devkit
monitor_speed = 115200
build_type = release # debug
board_build.filesystem = littlefs
monitor_raw = true
build_flags =
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DRGB_PIN=19

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
board_build.mcu = esp32s2
monitor_speed = 115200
build_type = release # debug
board_build.filesystem = littlefs
monitor_raw = true
build_flags =
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=5
    -DTFT_DC=7
    -DTFT_RST=3
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DRGB_PIN=39
